plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

// Сборка для себя или для игроков.
//
// Служебные команды (/srspot, /srpath, /srmob, /srlook) включались флагом debug, а он
// правится руками в конфиге — то есть их мог открыть себе любой игрок. Теперь их держит
// ещё и константа Dev.ON: у неё две версии исходника, и релизная равна false. Условие
// с константой компилятор сворачивает, поэтому в релизном байткоде не остаётся даже
// вызова — а раз вызовов нет, сами классы можно убрать из архива.
//
//   gradlew build              — сборка для себя, команды на месте
//   gradlew build -Prelease    — сборка для игроков, команд нет
def isRelease = project.hasProperty('release')

sourceSets {
	main {
		java {
			srcDir isRelease ? 'src/release/java' : 'src/dev/java'
		}
	}
}

def devOnlyClasses = [
		'com/ryn/skyryn/waypoint/MobScanner*.class',
		'com/ryn/skyryn/waypoint/SpotRecorder*.class',
		'com/ryn/skyryn/waypoint/PathRecorder*.class',
		'com/ryn/skyryn/dev/LookProbe*.class',
]

// Чистим все архивы разом — и jar, и sources: иначе вырезанное из одного лежало бы
// рядом в другом. sourcesJar появляется ниже, по withSourcesJar(), поэтому берём
// задачи по типу, а не по имени.
tasks.withType(Jar).configureEach {
	if (isRelease) {
		exclude(devOnlyClasses)
		exclude(devOnlyClasses.collect { it.replace('.class', '.java') })
	}
}

repositories {
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content { includeGroup 'maven.modrinth' }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
