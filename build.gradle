plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

def isRelease = project.hasProperty('release')

sourceSets {
	main {
		java {
			srcDir isRelease ? 'src/release/java' : 'src/dev/java'
		}
	}
}

def devOnlyClasses = [
		'com/ryn/skyryn/waypoint/MobScanner*.class',
		'com/ryn/skyryn/waypoint/SpotRecorder*.class',
		'com/ryn/skyryn/waypoint/PathRecorder*.class',
		'com/ryn/skyryn/dev/LookProbe*.class',
]

tasks.withType(Jar).configureEach {
	if (isRelease) {
		exclude(devOnlyClasses)
		exclude(devOnlyClasses.collect { it.replace('.class', '.java') })
	}
}

repositories {
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content { includeGroup 'maven.modrinth' }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
