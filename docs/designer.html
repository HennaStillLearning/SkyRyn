<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkyRyn — GUI Designer (offline)</title>
<style>
  :root{
    --bg:#141419; --panel:#1a1a24; --panel2:#20202c; --border:#2e2e3c;
    --border-strong:#3d3d52; --accent:#5b8def; --accent-soft:#2a3f63;
    --text:#f2f3f7; --dim:#c8cad4; --faint:#9096a6; --gold:#ffd24a; --green:#5fd68a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,sans-serif;font-size:14px;display:flex;flex-direction:column;height:100vh;overflow:hidden}
  button{font-family:inherit;font-size:13px;color:var(--text);background:var(--panel2);border:1px solid var(--border-strong);border-radius:6px;padding:6px 10px;cursor:pointer}
  button:hover{background:#28283a}
  button.primary{background:var(--accent-soft);border-color:var(--accent)}
  input,textarea,select{font-family:inherit;font-size:13px;color:var(--text);background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:6px 8px;width:100%}
  textarea{resize:vertical;min-height:52px;line-height:1.45}
  label.f{display:block;margin:10px 0 4px;color:var(--faint);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
  ::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#33334a;border-radius:6px}

  header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--border);flex:0 0 auto}
  header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.3px}
  header .sp{flex:1}
  header select{width:auto;min-width:160px}
  .tag{font-size:11px;color:var(--faint);border:1px solid var(--border);border-radius:20px;padding:2px 8px}

  main{flex:1;display:flex;min-height:0}
  .col{display:flex;flex-direction:column;min-height:0}
  .palette{width:210px;flex:0 0 auto;background:var(--panel);border-right:1px solid var(--border);overflow:auto;padding:10px}
  .grp{color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin:12px 0 6px}
  .grp:first-child{margin-top:0}
  .chips{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .chip{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;cursor:grab;text-align:center;user-select:none}
  .chip:hover{border-color:var(--accent);background:#26263a}
  .chip .ic{font-size:20px;line-height:1}
  .chip .lb{font-size:11px;color:var(--dim)}

  .canvasWrap{flex:1;min-width:0;position:relative;overflow:auto;background:
     linear-gradient(#00000000 0 0) ,
     repeating-linear-gradient(0deg,#1c1c26 0 1px,transparent 1px 24px),
     repeating-linear-gradient(90deg,#1c1c26 0 1px,transparent 1px 24px),
     var(--bg)}
  #canvas{position:absolute;inset:0;min-width:100%;min-height:100%}
  .el{position:absolute;background:var(--panel2);border:1px solid var(--border-strong);border-radius:8px;padding:6px 8px;cursor:move;overflow:hidden;user-select:none}
  .el:hover{border-color:var(--accent)}
  .el.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .el .row{display:flex;align-items:center;gap:6px}
  .el .ic{font-size:18px;line-height:1}
  .el .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .el .ty{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
  .el .desc{font-size:11px;color:var(--dim);margin-top:4px;line-height:1.3;overflow:hidden}
  .el .hasNote{position:absolute;top:5px;right:6px;font-size:9px;color:var(--gold)}
  .handle{position:absolute;right:0;bottom:0;width:14px;height:14px;cursor:nwse-resize;background:
      linear-gradient(135deg,transparent 50%,var(--accent) 50%)}

  .inspector{width:300px;flex:0 0 auto;background:var(--panel);border-left:1px solid var(--border);overflow:auto;padding:12px}
  .inspector .empty{color:var(--faint);font-size:13px;line-height:1.6;margin-top:20px;text-align:center}
  .inspector h2{font-size:14px;margin:0 0 2px;display:flex;align-items:center;gap:8px}
  .inspector h2 .ic{font-size:20px}
  .inspector .del{margin-top:14px;width:100%;background:#3a1f1f;border-color:#7a2f2f;color:#ffb0b0}
  .inspector .del:hover{background:#4a2525}

  footer{flex:0 0 auto;padding:6px 12px;background:var(--panel);border-top:1px solid var(--border);color:var(--faint);font-size:12px;display:flex;gap:16px}
  .saved{color:var(--green)}
</style>
</head>
<body>

<header>
  <h1>SkyRyn · GUI Designer</h1>
  <span class="tag">offline</span>
  <div class="sp"></div>
  <label class="f" style="margin:0;color:var(--faint)">Экран:</label>
  <select id="screenSel" title="Выбрать экран"></select>
  <button id="newScreen">+ экран</button>
  <button id="renameScreen">Переименовать</button>
  <button id="delScreen">Удалить</button>
  <button id="exportBtn">Экспорт JSON</button>
  <button id="importBtn">Импорт JSON</button>
  <input id="importFile" type="file" accept="application/json" style="display:none">
</header>

<main>
  <div class="col palette" id="palette"></div>

  <div class="canvasWrap" id="canvasWrap">
    <div id="canvas"></div>
  </div>

  <div class="col inspector" id="inspector">
    <div class="empty">Перетащи иконку из палитры на холст.<br><br>Кликни по элементу — здесь появятся его свойства.</div>
  </div>
</main>

<footer>
  <span id="status" class="saved">автосохранение включено</span>
  <span>перетаскивай элементы мышью · угол — размер · Del — удалить выбранный</span>
</footer>

<script>
"use strict";

/* ---------- Палитра иконок ---------- */
const PALETTE = [
  { group:"SkyBlock скиллы", items:[
    {type:"hunting",   label:"Hunting",   icon:"🪢"},
    {type:"mining",    label:"Mining",    icon:"⛏️"},
    {type:"farming",   label:"Farming",   icon:"🌾"},
    {type:"combat",    label:"Combat",    icon:"⚔️"},
    {type:"foraging",  label:"Foraging",  icon:"🌳"},
    {type:"fishing",   label:"Fishing",   icon:"🎣"},
    {type:"enchanting",label:"Enchanting",icon:"📖"},
    {type:"taming",    label:"Taming",    icon:"🐾"},
  ]},
  { group:"Элементы", items:[
    {type:"skill",     label:"Skill",     icon:"✨"},
    {type:"item",      label:"Item",      icon:"🗡️"},
    {type:"stat",      label:"Stat",      icon:"📊"},
    {type:"armor",     label:"Armor",     icon:"🛡️"},
    {type:"slot",      label:"Slot",      icon:"⬜"},
    {type:"equip",     label:"Equip slot",icon:"🧩"},
    {type:"utility",   label:"Utility",   icon:"🔧"},
    {type:"pet",       label:"Pet",       icon:"🐉"},
    {type:"powerstone",label:"Powerstone",icon:"💠"},
  ]},
  { group:"Логика", items:[
    {type:"method",    label:"Method",    icon:"ƒ"},
    {type:"function",  label:"Function",  icon:"⚙️"},
  ]},
];
const ICON = {};
PALETTE.forEach(g=>g.items.forEach(i=>ICON[i.type]={icon:i.icon,label:i.label}));

/* ---------- Состояние (все экраны в localStorage) ---------- */
const KEY = "skyryn.designer.v1";
let store = load();
function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s&&s.screens&&s.screens.length) return s; }catch(e){}
  return { screens:[ {name:"Новый экран", elements:[]} ], current:0 };
}
function persist(){
  try{ localStorage.setItem(KEY, JSON.stringify(store)); flash("сохранено"); }
  catch(e){ status.textContent="localStorage недоступен — сохраняй через Экспорт JSON"; status.className=""; }
}
let flashT=null;
function flash(t){ status.textContent=t; status.className="saved"; clearTimeout(flashT);
  flashT=setTimeout(()=>{status.textContent="автосохранение включено";},1200); }

function screen(){ return store.screens[store.current]; }
let selId = null;
let uid = Date.now();

/* ---------- Палитра: рендер + drag ---------- */
const palette = document.getElementById("palette");
PALETTE.forEach(g=>{
  const h=document.createElement("div"); h.className="grp"; h.textContent=g.group; palette.appendChild(h);
  const wrap=document.createElement("div"); wrap.className="chips";
  g.items.forEach(it=>{
    const c=document.createElement("div"); c.className="chip"; c.draggable=true;
    c.innerHTML=`<div class="ic">${it.icon}</div><div class="lb">${it.label}</div>`;
    c.addEventListener("dragstart",e=>{ e.dataTransfer.setData("text/type", it.type); });
    wrap.appendChild(c);
  });
  palette.appendChild(wrap);
});

/* ---------- Холст: drop из палитры ---------- */
const canvasWrap=document.getElementById("canvasWrap");
const canvas=document.getElementById("canvas");
canvasWrap.addEventListener("dragover",e=>e.preventDefault());
canvasWrap.addEventListener("drop",e=>{
  e.preventDefault();
  const type=e.dataTransfer.getData("text/type"); if(!type) return;
  const r=canvas.getBoundingClientRect();
  const x=e.clientX-r.left+canvasWrap.scrollLeft, y=e.clientY-r.top+canvasWrap.scrollTop;
  const el={ id:++uid, type, label:ICON[type].label, x:Math.max(0,x-60), y:Math.max(0,y-30),
             w:130, h:66, whatItDoes:"", effect:"", func:"", source:"", notes:"" };
  screen().elements.push(el); persist(); render(); select(el.id); focusFirstField();
});
canvas.addEventListener("mousedown",e=>{ if(e.target===canvas){ select(null); } });

/* ---------- Рендер элементов ---------- */
function render(){
  canvas.innerHTML="";
  screen().elements.forEach(el=>{
    const d=document.createElement("div");
    d.className="el"+(el.id===selId?" sel":"");
    d.style.left=el.x+"px"; d.style.top=el.y+"px"; d.style.width=el.w+"px"; d.style.height=el.h+"px";
    const note=(el.whatItDoes||el.effect||el.func||el.source||el.notes)?'<div class="hasNote">●</div>':"";
    d.innerHTML=`${note}
      <div class="row"><span class="ic">${ICON[el.type].icon}</span><span class="nm">${esc(el.label||ICON[el.type].label)}</span></div>
      <div class="ty">${el.type}</div>
      ${el.whatItDoes?`<div class="desc">${esc(el.whatItDoes)}</div>`:""}
      <div class="handle"></div>`;
    d.addEventListener("mousedown",ev=>startDrag(ev,el,d));
    canvas.appendChild(d);
  });
}
function esc(s){ return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

/* ---------- Перемещение и ресайз ---------- */
function startDrag(ev,el,d){
  ev.preventDefault(); select(el.id);
  const resize=ev.target.classList.contains("handle");
  const sx=ev.clientX, sy=ev.clientY, ox=el.x, oy=el.y, ow=el.w, oh=el.h;
  function mv(e){
    if(resize){ el.w=Math.max(48,ow+(e.clientX-sx)); el.h=Math.max(40,oh+(e.clientY-sy));
      d.style.width=el.w+"px"; d.style.height=el.h+"px"; }
    else { el.x=Math.max(0,ox+(e.clientX-sx)); el.y=Math.max(0,oy+(e.clientY-sy));
      d.style.left=el.x+"px"; d.style.top=el.y+"px"; }
  }
  function up(){ document.removeEventListener("mousemove",mv); document.removeEventListener("mouseup",up); persist(); }
  document.addEventListener("mousemove",mv); document.addEventListener("mouseup",up);
}

/* ---------- Выбор + инспектор ---------- */
const inspector=document.getElementById("inspector");
function select(id){ selId=id; render(); drawInspector(); }
function drawInspector(){
  const el=screen().elements.find(e=>e.id===selId);
  if(!el){ inspector.innerHTML=`<div class="empty">Перетащи иконку из палитры на холст.<br><br>Кликни по элементу — здесь появятся его свойства.</div>`; return; }
  inspector.innerHTML=`
    <h2><span class="ic">${ICON[el.type].icon}</span> ${ICON[el.type].label}</h2>
    <label class="f">Название</label>
    <input id="i_label" value="${esc(el.label)}">
    <label class="f">Что делает</label>
    <textarea id="i_what" placeholder="Коротко: что это за элемент в GUI">${esc(el.whatItDoes)}</textarea>
    <label class="f">Что даёт в игре</label>
    <textarea id="i_eff" placeholder="Эффект / польза для игрока">${esc(el.effect)}</textarea>
    <label class="f">Какая функция</label>
    <textarea id="i_func" placeholder="Что вычисляет / какое действие выполняет">${esc(el.func)}</textarea>
    <label class="f">Откуда мод подцепит</label>
    <select id="i_srcSel">
      ${["","Hypixel API (профиль)","Скорборд","Инвентарь / экипировка","Attribute Menu","Базар","Ручной ввод","Конфиг мода","Другое"].map(o=>`<option ${o===el.source?"selected":""}>${o}</option>`).join("")}
    </select>
    <input id="i_src" style="margin-top:6px" placeholder="…или впиши свой источник" value="${esc(el.source && !isPreset(el.source)?el.source:"")}">
    <label class="f">Заметки</label>
    <textarea id="i_notes" placeholder="Любые мысли по реализации">${esc(el.notes)}</textarea>
    <button class="del" id="i_del">Удалить элемент</button>
  `;
  bind("i_label","label"); bind("i_what","whatItDoes"); bind("i_eff","effect");
  bind("i_func","func"); bind("i_notes","notes");
  const sel=document.getElementById("i_srcSel"), free=document.getElementById("i_src");
  sel.addEventListener("change",()=>{ el.source=sel.value; if(sel.value) free.value=""; persist(); });
  free.addEventListener("input",()=>{ el.source=free.value; sel.value=""; persist(); });
  document.getElementById("i_del").addEventListener("click",()=>{
    store.screens[store.current].elements=screen().elements.filter(e=>e.id!==el.id);
    selId=null; persist(); render(); drawInspector();
  });
  function bind(inputId,field){ const n=document.getElementById(inputId);
    n.addEventListener("input",()=>{ el[field]=n.value; if(field==="label"||field==="whatItDoes") render(); persist(); }); }
}
function isPreset(s){ return ["Hypixel API (профиль)","Скорборд","Инвентарь / экипировка","Attribute Menu","Базар","Ручной ввод","Конфиг мода","Другое"].includes(s); }
function focusFirstField(){ const n=document.getElementById("i_label"); if(n){ n.focus(); n.select(); } }

/* ---------- Экраны ---------- */
const screenSel=document.getElementById("screenSel");
function drawScreens(){
  screenSel.innerHTML=store.screens.map((s,i)=>`<option value="${i}" ${i===store.current?"selected":""}>${esc(s.name)}</option>`).join("");
}
screenSel.addEventListener("change",()=>{ store.current=+screenSel.value; selId=null; persist(); render(); drawInspector(); });
document.getElementById("newScreen").addEventListener("click",()=>{
  const name=prompt("Название экрана:","Экран "+(store.screens.length+1)); if(name===null) return;
  store.screens.push({name:name||"Экран", elements:[]}); store.current=store.screens.length-1;
  selId=null; persist(); drawScreens(); render(); drawInspector();
});
document.getElementById("renameScreen").addEventListener("click",()=>{
  const name=prompt("Новое название:",screen().name); if(name===null) return;
  screen().name=name||screen().name; persist(); drawScreens();
});
document.getElementById("delScreen").addEventListener("click",()=>{
  if(store.screens.length<=1){ alert("Нельзя удалить последний экран."); return; }
  if(!confirm("Удалить экран «"+screen().name+"»?")) return;
  store.screens.splice(store.current,1); store.current=0; selId=null;
  persist(); drawScreens(); render(); drawInspector();
});

/* ---------- Экспорт / импорт ---------- */
document.getElementById("exportBtn").addEventListener("click",()=>{
  const blob=new Blob([JSON.stringify(store,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="skyryn-designs.json"; a.click(); URL.revokeObjectURL(a.href);
});
document.getElementById("importBtn").addEventListener("click",()=>document.getElementById("importFile").click());
document.getElementById("importFile").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f) return; const rd=new FileReader();
  rd.onload=()=>{ try{ const s=JSON.parse(rd.result);
      if(s&&s.screens){ store=s; store.current=Math.min(store.current||0,store.screens.length-1);
        selId=null; persist(); drawScreens(); render(); drawInspector(); }
      else alert("Не похоже на файл дизайнера."); }
    catch(err){ alert("Ошибка чтения JSON: "+err.message); } };
  rd.readAsText(f); e.target.value="";
});

/* ---------- Клавиши ---------- */
document.addEventListener("keydown",e=>{
  if((e.key==="Delete"||e.key==="Backspace") && selId!==null){
    const tag=document.activeElement.tagName;
    if(tag==="INPUT"||tag==="TEXTAREA"||document.activeElement.isContentEditable) return;
    store.screens[store.current].elements=screen().elements.filter(x=>x.id!==selId);
    selId=null; persist(); render(); drawInspector();
  }
});

/* ---------- Старт ---------- */
const status=document.getElementById("status");
drawScreens(); render(); drawInspector();
</script>
</body>
</html>
